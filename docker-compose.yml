name: juanico

services:
  php:
    build: ./docker/php
    container_name: juanico_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DATABASE_URL: "mysql://juanico:juanico@db:3306/juanico?serverVersion=8.0.32&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: juanico_nginx
    ports:
      - "8480:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.0.32
    container_name: juanico_db
    ports:
      - "4406:3306"
    environment:
      MYSQL_DATABASE: juanico
      MYSQL_USER: juanico
      MYSQL_PASSWORD: juanico
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: juanico_phpmyadmin
    ports:
      - "7070:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: juanico_mailpit
    ports:
      - "7025:8025"
      - "4025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
